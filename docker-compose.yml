services:
  postgres:
    image: pgvector/pgvector:pg17  # pgvector ready for Phase 2 personalization memory
    environment:
      POSTGRES_USER: overclock
      POSTGRES_PASSWORD: overclock
      POSTGRES_DB: overclock
    ports: ["5433:5432"]  # 5432 is taken by the local Postgres install
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
