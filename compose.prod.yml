# The whole stack as it would run on a server: docker compose -f compose.prod.yml up -d --build
# Any host that runs Docker works (a small VPS, Render, Railway, Fly, your own machine).
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: overclock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overclock}
      POSTGRES_DB: overclock
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overclock"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]

  api:
    build: ./services/api
    env_file: [services/api/.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://overclock:${POSTGRES_PASSWORD:-overclock}@postgres:5432/overclock
      REDIS_URL: redis://redis:6379/0
      CLERK_AUTHORIZED_PARTIES: ${WEB_ORIGIN:-http://localhost:3000}
      DEV_AUTH_USER: ""   # never bypass auth here
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${API_PORT:-8000}:8000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public Clerk key — baked into the browser bundle, so it must be set at build time.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      API_URL: http://api:8000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    depends_on: [api]
    ports: ["${WEB_PORT:-3000}:3000"]

volumes:
  pgdata:
  redisdata:
