[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "pyjwt[crypto]>=2.14.0",
    "pywebpush>=2.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
